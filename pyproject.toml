[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "google-trends-data"
version = "0.1.0"
description = "Day 75 of 100 Days of Code: combine Google Trends data with Tesla, Bitcoin and unemployment time series."
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
dependencies = [
    "pandas>=2.2",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs",
    "import-linter>=2",
    "jupyter>=1.1",
    "nbconvert>=7.16",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "ipykernel>=6.29",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
extend-exclude = ["framework", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.mypy]
strict = true
mypy_path = "src"

[tool.importlinter]
root_package = "google_trends_data"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers point inward"
type = "layers"
layers = [
    "google_trends_data.presentation",
    "google_trends_data.infrastructure",
    "google_trends_data.application",
    "google_trends_data.domain",
]

[[tool.importlinter.contracts]]
name = "Domain and application use no dataframe or plotting library"
type = "forbidden"
source_modules = ["google_trends_data.domain", "google_trends_data.application"]
forbidden_modules = ["pandas", "matplotlib"]
